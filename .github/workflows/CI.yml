name: CI

on: [push, pull_request]

jobs:
  phpcs:
    name: PHPCS and PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - run: composer update --prefer-dist --no-interaction --no-progress --with orchestra/testbench:^11.0
      - run: composer validate --strict
      - run: composer phpcs -- --dry-run --diff
      - run: composer phpstan

  phpunit:
    name: Laravel ${{ matrix.laravel }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: ['13']
        testbench: ['^11.0']
        include:
          - php: '8.3'
            laravel: '11'
            testbench: '^9.1'
          - php: '8.3'
            laravel: '12'
            testbench: '^10.0'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - run: composer update --prefer-dist --no-interaction --no-progress --with "orchestra/testbench:${{ matrix.testbench }}"
      - run: composer phpunit -- --fail-on-warning --fail-on-risky --fail-on-deprecation --fail-on-phpunit-deprecation

  notify:
    name: Slack Notify
    runs-on: ubuntu-latest
    needs: [phpcs, phpunit]
    if: always()
    steps:
      - name: Slack Notify
        uses: baijunyao/action-slack-notify@v3.0.0
        if: always()
        with:
          slack_channel_id: CQPKN13E3
          slack_bot_token: ${{ secrets.SLACK_BOT_TOKEN }}
          github_context: ${{ toJson(github) }}
